<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slate game</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      canvas { display: block; width: 100%; height: 100%; outline: none; image-rendering: pixelated; }
      #start {
        position: fixed; inset: 0; display: grid; place-items: center; background: #0b0d1a;
        color: #94b0c2; font: 16px/1.4 ui-monospace, Consolas, monospace; cursor: pointer; user-select: none;
      }
      #start.ready::after { content: "▶  click or press a key to play"; color: #f4f4f4; animation: blink 1.2s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0.35; } }
      .err { position: fixed; left: 8px; bottom: 8px; margin: 0; color: #ff8a8a; font: 13px monospace; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <div id="start">loading…</div>
    <!-- macroquad's bundle assigns this global from strict code (an unused network plugin) -->
    <script>var register_plugin;</script>
    <script src="mq_js_bundle.js"></script>
    <script src="slate.js"></script>
    <script>slateRun();</script>
  </body>
</html>
