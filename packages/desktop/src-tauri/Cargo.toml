[package]
name = "slate"
version = "0.3.0"
description = "Slate - a pixel game studio"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
base64 = "0.22"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
miniz_oxide = "0.8"
sha2 = "0.10"
ring = "0.17"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
